<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">How Nigel learns</title>
  <desc id="desc">The manager sees four progress flags and picks a sub-goal coordinate. The worker sees its position, the flags and that goal, and picks a move. The manager earns plus or minus 100 for whether its sub-goal produced a milestone; the worker earns 100 for reaching its tile, pays a step penalty, and loses 200 for drowning.</desc>
  <rect width="1200" height="600" rx="20" fill="#0e1116"/><text x="56" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#e6eaf0">How Nigel learns</text><text x="56" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b95a5">Two DQNs, two jobs, and no shared rewards.</text><rect x="56" y="128" width="316" height="254" rx="14" fill="#151a21" stroke="#262d38" stroke-width="2"/><rect x="56" y="128" width="6" height="254" rx="3" fill="#f5a524"/><text x="84" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6eaf0">Manager</text><text x="84" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f5a524">DQN · plans</text><text x="84" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#8b95a5">SEES</text><text x="84" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">has log · bridge placed ·</text><text x="84" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">crossed · last goal failed</text><text x="84" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#8b95a5">PICKS</text><text x="84" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">one of 4 sub-goals</text><line x1="372" y1="230" x2="432" y2="230" stroke="#f5a524" stroke-width="3"/><path d="M430 222 L442 230 L430 238 Z" fill="#f5a524"/><text x="407.0" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f5a524">goal</text><rect x="442" y="128" width="316" height="254" rx="14" fill="#151a21" stroke="#262d38" stroke-width="2"/><rect x="442" y="128" width="6" height="254" rx="3" fill="#38bdf8"/><text x="470" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6eaf0">Worker</text><text x="470" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#38bdf8">goal-conditioned DQN + HER</text><text x="470" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#8b95a5">SEES</text><text x="470" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">position · flags · goal (x, y)</text><text x="470" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#8b95a5">PICKS</text><text x="470" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">UP · DOWN · LEFT · RIGHT</text><line x1="758" y1="230" x2="818" y2="230" stroke="#f5a524" stroke-width="3"/><path d="M816 222 L828 230 L816 238 Z" fill="#f5a524"/><text x="793.0" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f5a524">move</text><rect x="828" y="128" width="316" height="254" rx="14" fill="#151a21" stroke="#262d38" stroke-width="2"/><rect x="828" y="128" width="6" height="254" rx="3" fill="#4ade80"/><text x="856" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6eaf0">World</text><text x="856" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4ade80">20 × 12 grid</text><text x="856" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#8b95a5">MILESTONES</text><text x="856" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">log picked up · bridge placed</text><text x="856" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">· crossed · reached home</text><text x="856" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#8b95a5">ENDS</text><text x="856" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">at home, or drowned</text><line x1="56" y1="420" x2="1144" y2="420" stroke="#262d38" stroke-width="2"/><text x="56" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#8b95a5">MANAGER IS PAID FOR</text><text x="56" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#4ade80">+100</text><text x="148" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">its sub-goal produced the milestone</text><text x="56" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#f87171">−100</text><text x="148" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">anything else, then it re-plans</text><text x="628" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#8b95a5">WORKER IS PAID FOR</text><text x="628" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#4ade80">+100</text><text x="720" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">reaching the tile it was given</text><text x="628" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#8b95a5">−step</text><text x="720" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">each move, plus a small novelty bonus</text><text x="628" y="574" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#f87171">−200</text><text x="720" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6eaf0">walking into the river</text>
</svg>
